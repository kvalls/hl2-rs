[package]
name = "hl2-bevy"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
modkit-core.workspace = true
source-assets.workspace = true
source-ui.workspace = true
hl2-ui.workspace = true
glam.workspace = true
hl2-simulation = { path = "../hl2-simulation" }
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "2d_bevy_render", "bevy_audio", "wav", "bevy_log", "ui", "system_clipboard"] }
rfd = "0.17.2"
fontdue = "0.9.3"

[[bin]]
name = "hl2-bevy"
path = "src/main.rs"

# macOS: the screen's visible frame (without the menu bar and Dock) for windowed placement.
# All of these are already in the build through Bevy, winit and wgpu.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6"
