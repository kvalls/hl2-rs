[package]
name = "hl2-bevy"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
modkit-core.workspace = true
source-assets.workspace = true
hl2-ui.workspace = true
glam.workspace = true
hl2-simulation = { path = "../hl2-simulation" }
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "2d_bevy_render", "bevy_audio", "wav", "bevy_log", "ui", "system_clipboard"] }
rfd = "0.17.2"

[[bin]]
name = "hl2-bevy"
path = "src/main.rs"
