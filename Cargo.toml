[workspace]
members = ["crates/modkit-core", "crates/source-assets", "crates/source-ui", "crates/hl2-simulation", "crates/hl2-ui", "crates/hl2-bevy"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
glam = { version = "0.27", features = ["serde"] }
modkit-core = { path = "crates/modkit-core" }
source-assets = { path = "crates/source-assets" }
source-ui = { path = "crates/source-ui" }
hl2-simulation = { path = "crates/hl2-simulation" }
hl2-ui = { path = "crates/hl2-ui" }

[profile.dev]
opt-level = 1
# Line tables keep panic backtraces readable while shrinking target/debug.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Third-party crates (Bevy, wgpu, Rapier...) carry no debug info in test builds.
debug = false
